<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="70%" stop-color="#070c14"/>
      <stop offset="100%" stop-color="#03060a"/>
    </radialGradient>
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
    <linearGradient id="fuchsiaNeon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0077"/>
      <stop offset="100%" stop-color="#9d00ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Shield / Squircle Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#00f0ff" stroke-width="3" stroke-opacity="0.25" />

  <!-- Tactical Grid Markers -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.12" stroke-dasharray="4,8" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ff0077" stroke-width="1" stroke-opacity="0.1" />

  <!-- Crosshair Accents -->
  <line x1="256" y1="36" x2="256" y2="70" stroke="#00f0ff" stroke-width="3" stroke-opacity="0.6" />
  <line x1="256" y1="442" x2="256" y2="476" stroke="#00f0ff" stroke-width="3" stroke-opacity="0.6" />
  <line x1="36" y1="256" x2="70" y2="256" stroke="#00f0ff" stroke-width="3" stroke-opacity="0.6" />
  <line x1="442" y1="256" x2="476" y2="256" stroke="#00f0ff" stroke-width="3" stroke-opacity="0.6" />

  <!-- Atomic Orbital 1 (Rotated 30 deg) -->
  <g transform="rotate(30 256 256)">
    <ellipse cx="256" cy="256" rx="170" ry="60" fill="none" stroke="url(#cyanNeon)" stroke-width="6" filter="url(#glow)" stroke-opacity="0.9" />
    <circle cx="426" cy="256" r="8" fill="#00f0ff" filter="url(#glow)" />
    <circle cx="86" cy="256" r="6" fill="#00f0ff" />
  </g>

  <!-- Atomic Orbital 2 (Rotated -30 deg) -->
  <g transform="rotate(-30 256 256)">
    <ellipse cx="256" cy="256" rx="170" ry="60" fill="none" stroke="url(#fuchsiaNeon)" stroke-width="6" filter="url(#glow)" stroke-opacity="0.9" />
    <circle cx="256" cy="196" r="8" fill="#ff0077" filter="url(#glow)" />
    <circle cx="256" cy="316" r="6" fill="#ff0077" />
  </g>

  <!-- Atomic Orbital 3 (Vertical 90 deg) -->
  <g transform="rotate(90 256 256)">
    <ellipse cx="256" cy="256" rx="170" ry="60" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.5" stroke-dasharray="8,6" />
    <circle cx="426" cy="256" r="5" fill="#38bdf8" />
  </g>

  <!-- Central High-Energy Nucleus -->
  <circle cx="256" cy="256" r="38" fill="#00f0ff" filter="url(#glow)" opacity="0.3" />
  <circle cx="256" cy="256" r="26" fill="url(#cyanNeon)" />
  <circle cx="256" cy="256" r="14" fill="#ffffff" />

  <!-- Tech Corner Markers -->
  <path d="M 64 96 L 64 64 L 96 64" fill="none" stroke="#00f0ff" stroke-width="3" stroke-opacity="0.7" />
  <path d="M 448 96 L 448 64 L 416 64" fill="none" stroke="#00f0ff" stroke-width="3" stroke-opacity="0.7" />
  <path d="M 64 416 L 64 448 L 96 448" fill="none" stroke="#00f0ff" stroke-width="3" stroke-opacity="0.7" />
  <path d="M 448 416 L 448 448 L 416 448" fill="none" stroke="#00f0ff" stroke-width="3" stroke-opacity="0.7" />
</svg>
